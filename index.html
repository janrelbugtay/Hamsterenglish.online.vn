<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (typeof window === "undefined" || !window.localStorage) return;
          var ls = window.localStorage;
          var mem = new Map();
          var nativeSet = Storage.prototype.setItem;
          var nativeGet = Storage.prototype.getItem;
          var nativeRemove = Storage.prototype.removeItem;

          // Purge stale Firestore multi-tab WebStorage keys and legacy duplicate class backups immediately
          var toDelete = [];
          for (var i = 0; i < ls.length; i++) {
            var k = ls.key(i);
            if (
              k &&
              (k.indexOf("firestore_") === 0 ||
                k === "squid_hamster_class_dollars_v13" ||
                k === "squid_user_classes")
            ) {
              toDelete.push(k);
            }
          }
          for (var j = 0; j < toDelete.length; j++) {
            try {
              nativeRemove.call(ls, toDelete[j]);
            } catch (e) {}
          }

          Storage.prototype.setItem = function (key, value) {
            var strVal = String(value);
            // Never allow firestore_* keys to be written to localStorage
            if (typeof key === "string" && key.indexOf("firestore_") === 0) {
              mem.set(key, strVal);
              return;
            }
            try {
              nativeSet.call(this, key, strVal);
              mem.delete(key);
            } catch (err) {
              try {
                // Evict largest non-auth keys and retry
                var candidates = [];
                for (var idx = 0; idx < this.length; idx++) {
                  var existingKey = this.key(idx);
                  if (
                    existingKey &&
                    existingKey !== key &&
                    existingKey.indexOf("firebase:authUser") === -1
                  ) {
                    var existingVal = nativeGet.call(this, existingKey) || "";
                    candidates.push({ k: existingKey, len: existingVal.length });
                  }
                }
                candidates.sort(function (a, b) {
                  return b.len - a.len;
                });
                for (var c = 0; c < Math.min(candidates.length, 6); c++) {
                  try {
                    nativeRemove.call(this, candidates[c].k);
                  } catch (e) {}
                }
                nativeSet.call(this, key, strVal);
                mem.delete(key);
              } catch (retryErr) {
                mem.set(key, strVal);
              }
            }
          };

          Storage.prototype.getItem = function (key) {
            if (mem.has(key)) return mem.get(key);
            try {
              return nativeGet.call(this, key);
            } catch (e) {
              return null;
            }
          };

          Storage.prototype.removeItem = function (key) {
            mem.delete(key);
            try {
              nativeRemove.call(this, key);
            } catch (e) {}
          };
        } catch (e) {}
      })();
    </script>
