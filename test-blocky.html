<!DOCTYPE html>
<html>
<body>
  <svg width="200" height="200" viewBox="0 0 100 100" style="color: #c2410c;">
    <!-- Mane & Tail (darker) -->
    <rect x="60" y="15" width="8" height="25" fill="#431407" />
    <rect x="10" y="40" width="10" height="25" fill="#431407" />
    
    <!-- Left Legs (back layer) -->
    <rect x="55" y="60" width="8" height="30" fill="currentColor" opacity="0.6"/>
    <rect x="15" y="60" width="8" height="30" fill="currentColor" opacity="0.6"/>
    
    <!-- Left Hooves -->
    <rect x="55" y="85" width="8" height="5" fill="#292524" opacity="0.8"/>
    <rect x="15" y="85" width="8" height="5" fill="#292524" opacity="0.8"/>

    <!-- Neck & Body -->
    <rect x="65" y="20" width="15" height="25" fill="currentColor" opacity="0.85"/>
    <rect x="20" y="35" width="60" height="25" fill="currentColor" opacity="1"/>

    <!-- Right Legs (front layer) -->
    <rect x="65" y="60" width="8" height="30" fill="currentColor" opacity="0.9"/>
    <rect x="25" y="60" width="8" height="30" fill="currentColor" opacity="0.9"/>
    
    <!-- Right Hooves -->
    <rect x="65" y="85" width="8" height="5" fill="#292524" />
    <rect x="25" y="85" width="8" height="5" fill="#292524" />

    <!-- Head -->
    <rect x="75" y="10" width="12" height="15" fill="currentColor" opacity="0.9"/>
    <!-- Snout -->
    <rect x="87" y="15" width="10" height="10" fill="currentColor" opacity="0.8"/>
    
    <!-- Ears -->
    <rect x="76" y="5" width="3" height="5" fill="currentColor" />
    <rect x="82" y="5" width="3" height="5" fill="currentColor" />
    
    <!-- Eye -->
    <rect x="80" y="13" width="2" height="2" fill="#000" />
  </svg>
</body>
</html>
