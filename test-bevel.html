<!DOCTYPE html>
<html>
<body style="background: #333; padding: 50px;">
  <svg width="200" height="200" viewBox="0 0 100 100" style="color: #ea580c;">
    <defs>
      <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
        <!-- Shadow -->
        <feDropShadow dx="2" dy="4" stdDeviation="2" flood-opacity="0.5" result="shadow" />
        
        <!-- Bevel Highlight -->
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur" />
        <feSpecularLighting in="blur" surfaceScale="2" specularConstant="1" specularExponent="30" lighting-color="white" result="specular">
          <fePointLight x="0" y="-50" z="100" />
        </feSpecularLighting>
        <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular" />
        
        <!-- Bevel Shadow -->
        <feSpecularLighting in="blur" surfaceScale="2" specularConstant="1" specularExponent="20" lighting-color="black" result="specularDark">
          <fePointLight x="100" y="150" z="100" />
        </feSpecularLighting>
        <feComposite in="specularDark" in2="SourceAlpha" operator="in" result="specularDark" />

        <!-- Combine -->
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
          <feMergeNode in="specular" />
        </feMerge>
      </filter>
      
      <filter id="blocky3d">
        <!-- Add some crisp edges -->
        <feComponentTransfer in="SourceAlpha">
          <feFuncA type="discrete" tableValues="0 1"/>
        </feComponentTransfer>
      </filter>
    </defs>
    
    <g filter="url(#bevel)">
        <!-- Horse shapes -->
        <rect x="60" y="15" width="8" height="25" fill="#431407" />
        <rect x="10" y="40" width="10" height="25" fill="#431407" />
        <rect x="55" y="60" width="8" height="20" fill="currentColor" opacity="0.6"/>
        <rect x="15" y="60" width="8" height="20" fill="currentColor" opacity="0.6"/>
        <rect x="65" y="20" width="15" height="25" fill="currentColor" opacity="0.85"/>
        <rect x="20" y="35" width="60" height="25" fill="currentColor" opacity="1"/>
        <rect x="65" y="60" width="8" height="20" fill="currentColor" opacity="0.9"/>
        <rect x="25" y="60" width="8" height="20" fill="currentColor" opacity="0.9"/>
        <rect x="75" y="10" width="12" height="15" fill="currentColor" opacity="0.9"/>
        <rect x="87" y="15" width="10" height="10" fill="currentColor" opacity="0.8"/>
    </g>
  </svg>
</body>
</html>
