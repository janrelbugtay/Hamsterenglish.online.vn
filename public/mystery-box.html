    <style>
      @keyframes floatUp {
        0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-110vh) scale(1.4) rotate(360deg); opacity: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(2deg); }
      }
      @keyframes dropDown {
        0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) scale(0.6) rotate(-90deg); opacity: 0; }
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
      }
      @keyframes confettiFall {
        0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }

        70% { transform: scale(1.08); }

    <script>
      // --- AUDIO SYNTHESIZER ---
      let audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playSound(type, isSoundMuted) {
        if (isSoundMuted) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === "click") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
          } else if (type === "hover") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            gain.gain.setValueAtTime(0.02, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
            osc.start();
            osc.stop(ctx.currentTime + 0.03);
          } else if (type === "correct") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.45);
            osc.start();
            osc.stop(ctx.currentTime + 0.45);
          } else if (type === "incorrect") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(250, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.35);
            osc.start();
            osc.stop(ctx.currentTime + 0.35);
          } else if (type === "suspense") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(220, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.7);
            osc.start();
            osc.stop(ctx.currentTime + 0.7);
          } else if (type === "win") {
            osc.type = "square";
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.12);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.24);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.36);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
            osc.start();
            osc.stop(ctx.currentTime + 0.8);
          } else if (type === "lose") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(280, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(130, ctx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
          } else if (type === "grand_win") {
            osc.type = "square";
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.18);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.36);
            osc.frequency.setValueAtTime(1046.5, ctx.currentTime + 0.54);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.8);
            osc.start();
            osc.stop(ctx.currentTime + 1.8);
          }
        } catch (e) {
          console.error("Audio playback error:", e);
        }
      }

      // --- PARSE PASTED QUIZ (STRICT 30 LIMIT) ---
      function parsePastedQuiz(rawText) {
        if (!rawText || !rawText.trim()) return [];
        const items = [];
        
        if (rawText.includes('\t')) {
          const lines = rawText.split(/\r?\n/).filter(line => line.trim());
          lines.forEach(line => {
            const parts = line.split('\t').map(p => p.trim());
            if (parts.length > 0) {
              items.push({
                question: parts[0],
                options: [parts[1] || "", parts[2] || "", parts[3] || "", parts[4] || ""],
                correctOptionIndex: 0
              });
            }
          });
          if (items.length > 0) {
            items.forEach(q => {
              while (q.options.length > 2 && q.options[q.options.length - 1] === "") {
                q.options.pop();
              }
            });
            return items.slice(0, 30);
          }
        }
        
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        let currentQ = null;
        const optionRegex = /^([a-eA-E1-4])[\.\)\:\-]\s+(.*)/;
        
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i];
          const ansMatch = line.match(/^answer\s*[:=]?\s*([a-eA-E1-4])/i);
          if (ansMatch) {
            if (currentQ) {
              const val = ansMatch[1].toUpperCase();
              if (/[A-E]/.test(val)) currentQ.correctOptionIndex = val.charCodeAt(0) - 65;
              else if (/[1-4]/.test(val)) currentQ.correctOptionIndex = parseInt(val) - 1;
            }
            continue;
          }

          let inlineAnswerMatch = line.match(/\banswer\s*[:=]?\s*([a-eA-E1-4])\b/i);
          if (inlineAnswerMatch) {
            const val = inlineAnswerMatch[1].toUpperCase();
            let idx = 0;
            if (/[A-E]/.test(val)) idx = val.charCodeAt(0) - 65;
            else if (/[1-4]/.test(val)) idx = parseInt(val) - 1;
            if (currentQ) currentQ.correctOptionIndex = idx;
            line = line.replace(inlineAnswerMatch[0], '').trim();
          }
          
          if (!line) continue;
          
          const optMatch = line.match(optionRegex);
          if (optMatch) {
            if (!currentQ) {
              currentQ = { question: "Question", options: ["", "", "", ""], correctOptionIndex: 0 };
              items.push(currentQ);
            }
            const optText = optMatch[2].trim();
            const prefix = optMatch[1].toUpperCase();
            let expectedIndex = -1;
            if (/[A-E]/.test(prefix)) expectedIndex = prefix.charCodeAt(0) - 65;
            else if (/[1-4]/.test(prefix)) expectedIndex = parseInt(prefix) - 1;
            
            if (expectedIndex >= 0 && expectedIndex < 4) {
              currentQ.options[expectedIndex] = optText;
            }
          } else {
            const qMatch = line.match(/^\d+[\.\)\:\-]\s+(.*)/);
            const qText = qMatch ? qMatch[1].trim() : line;
            currentQ = { question: qText, options: ["", "", "", ""], correctOptionIndex: 0 };
            items.push(currentQ);
          }
        }

        return items.filter(q => q.question && q.question.trim()).slice(0, 30);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      }

      function backToGames() {
        window.parent.postMessage({ type: "BACK_TO_GAMES", view: "games" }, "*");
      }

      // --- BOX CLICK IN GAME ---
      function handleBoxClick(boxNum) {
        const num = Number(boxNum);
        if (openedBoxes.includes(num)) return;
        if (selectedBoxAnimation !== null) return;
        
        playSound("click", isMuted);
        selectedBoxAnimation = num;
        renderApp();
        
        setTimeout(() => {
          playSound("suspense", isMuted);
          activeBox = customQuestions[num - 1] || customQuestions[0];
          activeBoxNumber = num;
          isAnswerRevealed = false;
          selectedOptionIndex = null;
          currentOutcome = null;
          modalStep = "question";
          targetTeamIdx = null;
          selectedBoxAnimation = null;
          isModalJustOpened = true;
          renderApp();
        }, 750);
      }

      function handleOptionSelect(index) {
        if (!isAnswerRevealed) {
          playSound("click", isMuted);
          selectedOptionIndex = index;
          isModalJustOpened = false;
          renderApp();
        }
      }

      function handleReveal() {
        playSound("suspense", isMuted);
        isAnswerRevealed = true;
        isModalJustOpened = false;
        renderApp();
      }

      function handleIncorrect() {
        playSound("incorrect", isMuted);
        isModalJustOpened = false;
        modalStep = "incorrect_transition";
        renderApp();
        
        setTimeout(() => {
          if (activeBoxNumber !== null && !openedBoxes.includes(activeBoxNumber)) {
            openedBoxes.push(activeBoxNumber);
          }
          activeBox = null;
          activeBoxNumber = null;
          if (teams.length > 1) {
            currentTeamIdx = (currentTeamIdx + 1) % teams.length;
          }
          renderApp();
          checkGameOver();
        }, 1300);
      }

      function handleCorrect() {
        playSound("correct", isMuted);
        isModalJustOpened = false;
        modalStep = "correct_transition";
        renderApp();
        
        setTimeout(() => {
          if (teams.length > 1) {
            modalStep = "decision";
          } else {
            handleDecision(0);
          }
          renderApp();
        }, 1300);
      }

      function handleDecision(choiceTargetIdx) {
        targetTeamIdx = choiceTargetIdx;
        const outcomes = getOutcomes();
        const randomOutcome = outcomes[Math.floor(Math.random() * outcomes.length)];
        currentOutcome = randomOutcome;

        const isPositive = !["sub", "lose"].some((prefix) => randomOutcome.id.startsWith(prefix));
        playSound(isPositive ? "win" : "lose", isMuted);

        celebration = isPositive ? "win" : "lose";
        setTimeout(() => {
          celebration = null;
          renderApp();
        }, 3000);

        if (currentOutcome.requiresTarget && teams.length > 1) {
          modalStep = "target_selection";
        } else {
          teams = currentOutcome.action(teams, choiceTargetIdx);
          if (activeBoxNumber !== null && !openedBoxes.includes(activeBoxNumber)) {
            openedBoxes.push(activeBoxNumber);
          }
          modalStep = "reveal";
        }
        renderApp();
      }

      function handleOutcomeTarget(targetIdx) {
        if (targetIdx !== null) {
          teams = currentOutcome.action(teams, targetTeamIdx, targetIdx);
        }
        if (activeBoxNumber !== null && !openedBoxes.includes(activeBoxNumber)) {
          openedBoxes.push(activeBoxNumber);
        }
        modalStep = "reveal";
        renderApp();
      }

      function closeReveal() {
        activeBox = null;
        activeBoxNumber = null;
        if (teams.length > 1) {
          currentTeamIdx = (currentTeamIdx + 1) % teams.length;
        }
        renderApp();
        checkGameOver();
      }

      function resetGameScores() {
        teams.forEach(t => t.score = 0);
        openedBoxes = [];
        currentTeamIdx = 0;
        activeBox = null;
        celebration = null;
        renderApp();
      }

      function checkGameOver() {
        if (gameState === "game" && openedBoxes.length >= customQuestions.length && activeBox === null) {
          playSound("grand_win", isMuted);
          renderApp();
        }
      }

      // --- QUESTION EDITOR METHODS (LIMIT TO 30) ---
      function addQuestion() {
        if (customQuestions.length >= 30) {
          showToast("Maximum limit of 30 questions reached!");
          return;
        }
        const newNum = customQuestions.length + 1;
        customQuestions.push({
          number: newNum,
          type: "mcq",
          question: "",
          options: ["", "", "", ""],
          correctOptionIndex: 0,
          optionImages: [null, null, null, null],
          answer: ""
        });
        showToast("Question " + newNum + " added!");
        renderApp();
      }

      function duplicateQuestion(index) {
        if (customQuestions.length >= 30) {
          showToast("Maximum limit of 30 questions reached!");
          return;
        }
        const src = customQuestions[index];
        const newQ = {
          number: customQuestions.length + 1,
          type: src.type,
          question: src.question,
          options: [...src.options],
          correctOptionIndex: src.correctOptionIndex,
          optionImages: [...(src.optionImages || [null, null, null, null])],
          answer: src.answer
        };
        customQuestions.splice(index + 1, 0, newQ);
        // renumber 1..30
        customQuestions.forEach((q, i) => q.number = i + 1);
        showToast("Question duplicated!");
        renderApp();
      }

      function removeQuestion(index) {
        if (customQuestions.length <= 1) {
          showToast("Must have at least 1 question.");
          return;
        }
        customQuestions.splice(index, 1);
        // renumber 1..30
        customQuestions.forEach((q, i) => q.number = i + 1);
        renderApp();
      }

      function showToast(msg) {
        editorToastMsg = msg;
        renderApp();
        setTimeout(() => {
          if (editorToastMsg === msg) {
            editorToastMsg = "";
            renderApp();
          }
        }, 3200);
      }

      function applyBulkPaste(action) {
        const parsed = parsePastedQuiz(bulkPasteText);
        if (parsed.length === 0) {
          showToast("No valid questions found in pasted text.");
          return;
        }
        
        let newQuestions = parsed.map((p, idx) => ({
          number: idx + 1,
          type: "mcq",
          question: p.question || ("Question " + (idx + 1)),
          options: p.options && p.options.length >= 2 ? p.options : ["Option 1", "Option 2", "Option 3", "Option 4"],
          correctOptionIndex: p.correctOptionIndex || 0,
          optionImages: [null, null, null, null],
          answer: (p.options && p.options[p.correctOptionIndex || 0]) || ""
        }));

        if (action === 'replace') {
          customQuestions = newQuestions.slice(0, 30);
        } else {
          // append up to 30
          const combined = [...customQuestions, ...newQuestions].slice(0, 30);
          customQuestions = combined;
        }

        // Renumber 1..30
        customQuestions.forEach((q, i) => q.number = i + 1);
        showBulkPasteModal = false;
        bulkPasteText = "";
        showToast("Loaded " + customQuestions.length + " questions (Max 30)!");
        renderApp();
      }

      async function generateAIQuestions() {
        if (!gameTopic) {
          showToast("Please enter a Topic first!");
          return;
        }
        isGenerating = true;
        renderApp();
        try {
          const res = await fetch("/api/generate-mystery-box-questions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              topic: gameTopic,
              level: genLevel,
              type: genType,
              count: 30
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          if (data.questions && data.questions.length > 0) {
            customQuestions = data.questions.slice(0, 30).map((q, i) => ({
              number: i + 1,
              type: "mcq",
              question: q.question || q.text || ("Question " + (i + 1)),
              options: q.options || ["Option 1", "Option 2", "Option 3", "Option 4"],
              correctOptionIndex: q.correctOptionIndex !== undefined ? q.correctOptionIndex : 0,
              optionImages: [null, null, null, null],
              answer: (q.options && q.options[q.correctOptionIndex || 0]) || ""
            }));
            showToast("Generated " + customQuestions.length + " questions! (1 to 30)");
          }
        } catch (e) {
          showToast("Error: " + e.message);
        } finally {
          isGenerating = false;
          renderApp();
        }
      }

      function saveGameData() {
        const validQs = customQuestions.filter(q => q.question && q.question.trim());
        if (validQs.length === 0) {
          alert("Please enter at least 1 valid question.");
          return;
        }
        const gameData = {
          topic: gameTopic,
          className: gameClass,
          folder: gameFolder,
          theme: gameTheme,
          difficulty: gameDifficulty,
          setupTeamCount: numPlayers === 1 ? 1 : 2,
          teams: teams,
          customQuestions: validQs.slice(0, 30)
        };
        window.parent.postMessage({ type: "SAVE_MYSTERY_BOX", data: gameData }, "*");
      }

                'Next' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      // --- RENDER 3: QUESTION EDITOR (MAX 30 QUESTIONS) ---
      function renderEditorScreen() {
        const questionsCards = customQuestions.map((q, idx) => {
          const dupDisabled = customQuestions.length >= 30 ? 'disabled' : '';
          const delDisabled = customQuestions.length <= 1 ? 'disabled' : '';

          const optionsList = (q.options || ["", "", "", ""]).map((opt, oIdx) => {
            const isChecked = q.correctOptionIndex === oIdx ? 'checked' : '';
            const borderCls = q.correctOptionIndex === oIdx ? 'border-orange-500 bg-orange-50/50 dark:bg-orange-950/20' : 'border-slate-200 dark:border-slate-700';

            let imgHtml = '';
            if (q.optionImages && q.optionImages[oIdx]) {
              imgHtml = '<div class="w-8 h-8 rounded shrink-0 overflow-hidden relative group">' +
                '<img src="' + escapeHtml(q.optionImages[oIdx]) + '" class="w-full h-full object-cover" />' +
                '<button onclick="customQuestions[' + idx + '].optionImages[' + oIdx + '] = null; renderApp();" class="absolute inset-0 bg-black/50 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">' +
                  '<i data-lucide="x" class="w-3.5 h-3.5"></i>' +
                '</button>' +
              '</div>';
            }

            return '<div class="flex items-center gap-2.5 bg-slate-50 dark:bg-slate-900 border ' + borderCls + ' p-2.5 rounded-xl">' +
              '<input type="radio" name="q-' + idx + '-correct" ' + isChecked + ' onchange="customQuestions[' + idx + '].correctOptionIndex = ' + oIdx + '; customQuestions[' + idx + '].answer = customQuestions[' + idx + '].options[' + oIdx + ']; renderApp();" class="w-5 h-5 accent-orange-500 cursor-pointer" />' +
              '<span class="font-bold text-slate-400 text-sm w-4">' + (oIdx + 1) + '.</span>' +
              '<input type="text" value="' + escapeHtml(opt) + '" oninput="customQuestions[' + idx + '].options[' + oIdx + '] = this.value; if(customQuestions[' + idx + '].correctOptionIndex === ' + oIdx + ') customQuestions[' + idx + '].answer = this.value;" placeholder="Option ' + (oIdx + 1) + '" class="flex-1 bg-transparent outline-none font-medium text-slate-700 dark:text-slate-200 text-sm" />' +
              imgHtml +
              '<button type="button" onclick="window.parent.postMessage({ type: \'OPEN_MEDIA_PICKER\', data: { qIdx: ' + idx + ', oIdx: ' + oIdx + ' } }, \'*\')" class="p-1.5 bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 text-slate-600 rounded-lg transition-colors cursor-pointer" title="Add Image">' +
                '<i data-lucide="image" class="w-4 h-4"></i>' +
              '</button>' +
            '</div>';
          }).join('');

          return '<div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-300 dark:border-slate-700 shadow-sm relative group">' +
            '<div class="flex justify-between items-center mb-4">' +
              '<div class="flex items-center gap-3">' +
                '<div class="w-10 h-10 rounded-full bg-orange-500 text-white font-black text-lg flex items-center justify-center shadow-md">' +
                  (idx + 1) +
                '</div>' +
                '<span class="font-bold text-slate-700 dark:text-slate-200 text-lg">Question ' + (idx + 1) + '</span>' +
              '</div>' +
              '<div class="flex items-center gap-2">' +
                '<button onclick="duplicateQuestion(' + idx + ')" ' + dupDisabled + ' class="p-2 bg-slate-100 hover:bg-blue-100 text-slate-600 hover:text-blue-600 rounded-xl transition-colors cursor-pointer disabled:opacity-40" title="Duplicate Question">' +
                  '<i data-lucide="copy" class="w-5 h-5"></i>' +
                '</button>' +
                '<button onclick="removeQuestion(' + idx + ')" ' + delDisabled + ' class="p-2 bg-slate-100 hover:bg-red-100 text-slate-600 hover:text-red-600 rounded-xl transition-colors cursor-pointer disabled:opacity-40" title="Delete Question">' +
                  '<i data-lucide="trash-2" class="w-5 h-5"></i>' +
                '</button>' +
              '</div>' +
            '</div>' +

            '<div class="mb-4">' +
              '<label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Question Text</label>' +
              '<input type="text" value="' + escapeHtml(q.question) + '" oninput="customQuestions[' + idx + '].question = this.value" placeholder="Type question ' + (idx + 1) + ' here..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-3.5 outline-none focus:border-orange-500 text-slate-800 dark:text-white font-medium" />' +
            '</div>' +

            '<div>' +
              '<label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Options (Select the correct option)</label>' +
              '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">' +
                optionsList +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        // Folders options
        const folderOptionsHtml = availableFolders.map(f => {
          const sel = gameFolder === f.name ? 'selected' : '';
          return '<option value="' + escapeHtml(f.name) + '" ' + sel + '>' + escapeHtml(f.name) + '</option>';
        }).join('');

        let toastHtml = '';
        if (editorToastMsg) {
          toastHtml = '<div class="bg-amber-100 border border-amber-300 text-amber-900 px-5 py-3 rounded-2xl mb-6 font-bold flex items-center gap-2 shadow-sm animate-pop-in">' +
            '<i data-lucide="sparkles" class="w-5 h-5 text-amber-600"></i> ' + escapeHtml(editorToastMsg) +
            '</div>';
        }

        const isAddDisabled = customQuestions.length >= 30 ? 'disabled' : '';
        const addBtnText = customQuestions.length >= 30 ? 'Maximum 30 Questions Reached' : 'Add Another Question';

        let modalHtml = '';
        if (showBulkPasteModal) {
          modalHtml = '<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">' +
            '<div class="bg-white dark:bg-slate-800 rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col gap-5 animate-pop-in">' +
              '<div class="flex justify-between items-center">' +
                '<h3 class="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-2">' +
                  '<i data-lucide="clipboard-list" class="w-6 h-6 text-orange-500"></i> Bulk Paste Questions' +
                '</h3>' +
                '<button onclick="showBulkPasteModal = false; renderApp();" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100 transition-colors cursor-pointer">' +
                  '<i data-lucide="x" class="w-6 h-6"></i>' +
                '</button>' +
              '</div>' +
              '<p class="text-sm text-slate-500 font-medium">' +
                'Paste numbered questions or spreadsheet tabs. Questions are strictly limited up to 30.' +
              '</p>' +
              '<textarea oninput="bulkPasteText = this.value" placeholder="1. What is the past tense of eat?&#10;A. Ate&#10;B. Eated&#10;C. Eating&#10;D. Eats&#10;Answer: A" class="w-full h-56 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-2xl p-4 font-mono text-sm outline-none focus:border-orange-500 text-slate-800 dark:text-white">' + escapeHtml(bulkPasteText) + '</textarea>' +
              '<div class="flex gap-3 justify-end">' +
                '<button onclick="showBulkPasteModal = false; renderApp();" class="px-5 py-3 rounded-xl font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">Cancel</button>' +
                '<button onclick="applyBulkPaste(\'append\')" class="px-6 py-3 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700 transition-colors cursor-pointer">Append (Up to 30)</button>' +
                '<button onclick="applyBulkPaste(\'replace\')" class="px-6 py-3 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600 transition-colors cursor-pointer">Replace All (Max 30)</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        }

        const genDisabled = isGenerating ? 'disabled' : '';
        const genBtnContent = isGenerating 
          ? '<div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Generating...' 
          : '<i data-lucide="sparkles" class="w-5 h-5"></i> Auto-Generate with AI';

        return '<div class="min-h-screen bg-slate-50 dark:bg-slate-900 p-6 md:p-10 font-sans">' +
          '<div class="max-w-4xl mx-auto">' +
            '<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 pb-6 border-b border-slate-200 dark:border-slate-800">' +
              '<div>' +
                '<h1 class="text-3xl sm:text-4xl font-black text-slate-800 dark:text-white">GAME SETUP</h1>' +
                '<p class="text-slate-500 font-bold text-sm mt-1">Configure questions (Limit: 1 to 30 questions)</p>' +
              '</div>' +
              '<div class="flex items-center gap-3">' +
                '<button onclick="setGameState(\'setup\')" class="px-5 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors cursor-pointer">' +
                  'Cancel' +
                '</button>' +
                '<button onclick="saveGameData()" class="flex items-center gap-2 px-6 py-2.5 rounded-xl bg-orange-500 text-white font-black hover:bg-orange-600 transition-all shadow-lg shadow-orange-500/30 cursor-pointer">' +
                  '<i data-lucide="save" class="w-5 h-5"></i> Save Quiz' +
                '</button>' +
              '</div>' +
            '</div>' +

            '<div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 mb-8">' +
              '<div class="grid grid-cols-1 md:grid-cols-3 gap-4">' +
                '<div>' +
                  '<label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Topic</label>' +
                  '<input type="text" value="' + escapeHtml(gameTopic) + '" oninput="gameTopic = this.value" placeholder="e.g. Present Simple" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-3 font-medium text-slate-700 dark:text-slate-200 outline-none focus:border-orange-500" />' +
                '</div>' +
                '<div>' +
                  '<label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Class Level</label>' +
                  '<input type="text" value="' + escapeHtml(gameClass) + '" oninput="gameClass = this.value" placeholder="e.g. Grade 3" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-3 font-medium text-slate-700 dark:text-slate-200 outline-none focus:border-orange-500" />' +
                '</div>' +
                '<div>' +
                  '<label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Folder</label>' +
                  '<select onchange="gameFolder = this.value" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-3 font-medium text-slate-700 dark:text-slate-200 outline-none focus:border-orange-500 cursor-pointer">' +
                    '<option value="" ' + (gameFolder === "" ? "selected" : "") + '>No Folder (Root)</option>' +
                    folderOptionsHtml +
                  '</select>' +
                '</div>' +
              '</div>' +
            '</div>' +

            toastHtml +

            '<div class="bg-orange-500/10 dark:bg-orange-950/30 border border-orange-500/20 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">' +
              '<div>' +
                '<span class="font-black text-lg text-orange-900 dark:text-orange-200 uppercase tracking-wider">' +
                  'Questions (' + customQuestions.length + ' / 30)' +
                '</span>' +
                '<p class="text-xs text-orange-700 dark:text-orange-300 font-medium">Limited to 30 mystery boxes maximum</p>' +
              '</div>' +
              '<div class="flex items-center gap-3 flex-wrap">' +
                '<button onclick="showBulkPasteModal = true; renderApp();" class="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold flex items-center gap-2 shadow-md shadow-orange-500/20 transition-all cursor-pointer active:scale-95">' +
                  '<i data-lucide="clipboard-list" class="w-5 h-5"></i> Bulk Paste' +
                '</button>' +
                '<button onclick="generateAIQuestions()" ' + genDisabled + ' class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white rounded-xl font-bold flex items-center gap-2 shadow-md shadow-purple-600/20 transition-all cursor-pointer active:scale-95">' +
                  genBtnContent +
                '</button>' +
              '</div>' +
            '</div>' +

            '<div class="space-y-5 mb-8">' +
              questionsCards +
            '</div>' +

            '<button onclick="addQuestion()" ' + isAddDisabled + ' class="w-full py-4 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 hover:border-orange-500 hover:text-orange-600 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">' +
              '<i data-lucide="plus" class="w-5 h-5"></i> ' + addBtnText +
            '</button>' +

            '<div class="sticky bottom-6 mt-8">' +
              '<button onclick="setGameState(\'setup\')" class="w-full py-5 bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 text-white rounded-2xl font-black text-2xl hover:shadow-xl hover:shadow-orange-500/30 transition-all flex items-center justify-center gap-3 cursor-pointer shadow-lg">' +
                '<i data-lucide="play" class="w-7 h-7 fill-current"></i> GO TO GAME SETUP' +
              '</button>' +
            '</div>' +
          '</div>' +
          modalHtml +
        '</div>';
      }

      // --- RENDER 4: MAIN GAMEPLAY SCREEN (NUMBERS 1 TO 30) ---
      function renderGameScreen() {
        const theme = getThemeStyles();
        const isGameOver = openedBoxes.length >= customQuestions.length && activeBox === null;
        const shakeClass = celebration === "lose" ? "animate-shake" : "";

        // Teams Scoreboard Header
        const teamsHeaderHtml = teams.map((team, idx) => {
          const isCurrent = currentTeamIdx === idx;
          const style = getTeamStyle(idx);
          const currentStyle = isCurrent 
            ? (style.border + ' ' + style.bg + ' scale-105 ' + style.shadow + ' z-10') 
            : 'border-transparent bg-white/10';
          const nameColor = isCurrent ? style.text : "text-white/70";
          const scoreColor = isCurrent ? style.text : "text-white";

          const vsHtml = idx < teams.length - 1 ? '<div class="text-white/40 font-black text-lg sm:text-2xl">VS</div>' : '';

          return '<div class="px-4 sm:px-6 py-2.5 sm:py-3 rounded-2xl border-4 transition-all duration-300 min-w-[110px] sm:min-w-[150px] text-center ' + currentStyle + '">' +
            '<p class="text-xs sm:text-sm font-black uppercase tracking-wider mb-0.5 ' + nameColor + '">' + escapeHtml(team.name) + '</p>' +
            '<p class="text-3xl sm:text-4xl font-black drop-shadow-sm ' + scoreColor + '">' +
              (team.score > 0 ? "+" : "") + team.score +
            '</p>' +
            '</div>' + vsHtml;
        }).join("");

        // Boxes Grid: 1 to 30
        const qCount = customQuestions.length;
        let gridColsClass = "grid-cols-4 sm:grid-cols-5 md:grid-cols-6";
        if (qCount <= 4) gridColsClass = "grid-cols-2 sm:grid-cols-4 max-w-xl";
        else if (qCount <= 6) gridColsClass = "grid-cols-3 sm:grid-cols-6 max-w-3xl";
        else if (qCount <= 12) gridColsClass = "grid-cols-3 sm:grid-cols-4 md:grid-cols-6 max-w-4xl";
        else if (qCount <= 20) gridColsClass = "grid-cols-4 sm:grid-cols-5 md:grid-cols-5 max-w-5xl";
        else gridColsClass = "grid-cols-4 sm:grid-cols-5 md:grid-cols-6 max-w-6xl";

        const gridHtml = customQuestions.map((box, idx) => {
          const boxNum = idx + 1; // 1 to 30
          const isOpened = openedBoxes.includes(boxNum);
          const isAnimating = selectedBoxAnimation === boxNum;
          const otherIsAnimating = selectedBoxAnimation !== null && selectedBoxAnimation !== boxNum;

          let boxCls = "";
          if (isOpened) {
            boxCls = "bg-white/30 text-slate-400/40 cursor-not-allowed border-2 border-white/40 shadow-inner scale-95";
          } else if (isAnimating) {
            boxCls = theme.box + " text-white border-4 scale-[1.4] z-50 shadow-[0_0_80px_rgba(255,255,255,0.9)] opacity-100 rotate-[360deg]";
          } else if (otherIsAnimating) {
            boxCls = theme.box + " text-white opacity-20 blur-sm scale-90 border-4";
          } else {
            boxCls = theme.box + " animate-box-glow text-white hover:-translate-y-2 hover:shadow-2xl " + theme.boxHover + " border-4 active:scale-95";
          }

          const boxDecor = !isOpened ? theme.boxContent : "";
          const numStyle = !isOpened ? theme.numberStyle : "relative text-slate-400/50 drop-shadow-none";

          return '<button onclick="handleBoxClick(' + boxNum + ')" onmouseenter="playSound(\'hover\', isMuted)" ' + (isOpened || selectedBoxAnimation !== null ? 'disabled' : '') + ' class="relative overflow-hidden group aspect-square rounded-[1.8rem] sm:rounded-[2.2rem] flex flex-col items-center justify-center text-3xl sm:text-4xl md:text-5xl font-black shadow-xl transition-all duration-500 cursor-pointer ' + boxCls + '">' +
            boxDecor +
            '<span class="z-10 font-black text-4xl sm:text-5xl md:text-6xl tracking-tight ' + numStyle + '">' +
              boxNum +
            '</span>' +
          '</button>';
        }).join("");

        // Active Box Question Modal
        let modalHtml = "";
        if (activeBox) {
          let modalInner = "";
          if (modalStep === "question") {
            const optionsList = (activeBox.options || []).map((opt, i) => {
              let optionStyle = "bg-white border-slate-200 text-slate-700";
              if (!isAnswerRevealed) {
                if (selectedOptionIndex === i) {
                  optionStyle = "bg-orange-100 border-orange-500 text-orange-900 shadow-lg scale-[1.02]";
                } else {
                  optionStyle += " hover:border-orange-300 hover:bg-orange-50/50 cursor-pointer";
                }
              } else {
                if (activeBox.correctOptionIndex === i) {
                  optionStyle = "bg-green-100 border-green-500 text-green-800 scale-[1.03] shadow-2xl z-10 font-black";
                } else if (selectedOptionIndex === i) {
                  optionStyle = "bg-red-100 border-red-500 text-red-700 opacity-90";
                } else {
                  optionStyle = "bg-white border-slate-200 text-slate-400 opacity-40";
                }
              }
              let imgHtml = '';
              if (activeBox.optionImages && activeBox.optionImages[i]) {
                imgHtml = '<div class="w-20 h-20 sm:w-28 sm:h-28 rounded-2xl overflow-hidden shrink-0 ml-3"><img src="' + escapeHtml(activeBox.optionImages[i]) + '" class="w-full h-full object-cover shadow-sm border-2 border-white" /></div>';
              }
              return '<button onclick="handleOptionSelect(' + i + ')" ' + (isAnswerRevealed ? 'disabled' : '') + ' class="p-5 sm:p-6 rounded-3xl text-xl sm:text-3xl font-bold border-[4px] transition-all flex items-center justify-between text-left w-full gap-3 ' + optionStyle + '">' +
                '<div class="flex items-center flex-1">' +
                  '<span class="mr-3 opacity-50 shrink-0 font-black">' + (i + 1) + '.</span>' +
                  '<span class="flex-1 break-words">' + escapeHtml(opt) + '</span>' +
                '</div>' +
                imgHtml +
              '</button>';
            }).join('');

            const controlsHtml = !isAnswerRevealed
              ? '<button onclick="handleReveal()" class="mx-auto flex items-center gap-3 px-10 py-5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white rounded-3xl font-black text-2xl shadow-xl transition-all hover:-translate-y-1 cursor-pointer">' +
                  '<i data-lucide="eye" class="w-7 h-7"></i> Reveal Answer' +
                '</button>'
              : '<div class="flex flex-col sm:flex-row justify-center gap-4 animate-pop-in">' +
                  '<button onclick="handleIncorrect()" class="flex-1 max-w-[280px] mx-auto sm:mx-0 flex items-center justify-center gap-3 px-8 py-5 bg-white hover:bg-red-50 text-slate-600 hover:text-red-600 border-[4px] border-slate-200 hover:border-red-300 rounded-3xl font-black text-2xl transition-all cursor-pointer">' +
                    '<i data-lucide="x" class="w-8 h-8 text-red-500"></i> INCORRECT' +
                  '</button>' +
                  '<button onclick="handleCorrect()" class="flex-1 max-w-[280px] mx-auto sm:mx-0 flex items-center justify-center gap-3 px-8 py-5 bg-green-500 hover:bg-green-600 text-white rounded-3xl font-black text-2xl shadow-xl transition-all hover:-translate-y-1 cursor-pointer">' +
                    '<i data-lucide="check" class="w-8 h-8"></i> CORRECT' +
                  '</button>' +
                '</div>';

            modalInner = '<p class="text-xl font-black text-orange-500 uppercase tracking-widest mb-4">QUESTION ' + activeBoxNumber + '</p>' +
              '<div class="bg-slate-50 rounded-[2.5rem] p-8 sm:p-12 mb-6 shadow-inner border border-slate-200">' +
                '<h3 class="text-3xl sm:text-5xl lg:text-6xl font-black text-slate-800 leading-tight">' + escapeHtml(activeBox.question) + '</h3>' +
                '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mt-8 max-w-5xl mx-auto">' +
                  optionsList +
                '</div>' +
              '</div>' +
              controlsHtml;
          } else if (modalStep === "correct_transition") {
            modalInner = '<div class="flex flex-col items-center justify-center p-10 py-20 text-green-500 animate-pop-in">' +
              '<div class="w-28 h-28 bg-green-100 rounded-full flex items-center justify-center mb-6 shadow-inner">' +
                '<i data-lucide="check" class="w-16 h-16 text-green-500" stroke-width="3"></i>' +
              '</div>' +
              '<h3 class="text-5xl sm:text-7xl font-black uppercase tracking-widest">CORRECT!</h3>' +
            '</div>';
          } else if (modalStep === "incorrect_transition") {
            modalInner = '<div class="flex flex-col items-center justify-center p-10 py-20 text-red-500 animate-shake">' +
              '<div class="w-28 h-28 bg-red-100 rounded-full flex items-center justify-center mb-6 shadow-inner">' +
                '<i data-lucide="x" class="w-16 h-16 text-red-500" stroke-width="3"></i>' +
              '</div>' +
              '<h3 class="text-5xl sm:text-7xl font-black uppercase tracking-widest">INCORRECT</h3>' +
            '</div>';
          } else if (modalStep === "decision") {
            const nextTeamIdx = (currentTeamIdx + 1) % teams.length;
            modalInner = '<div class="bg-white rounded-[2rem] p-6 sm:p-8 animate-pop-in">' +
              '<p class="text-xl font-black text-orange-500 uppercase tracking-widest mb-6">Decision Time!</p>' +
              '<div class="mb-8 p-6 bg-slate-50 border rounded-3xl">' +
                '<h3 class="text-3xl sm:text-4xl font-black text-slate-900 mb-2">You answered correctly! 🎉</h3>' +
                '<p class="text-lg sm:text-xl font-semibold text-slate-600">' +
                  'Do you want to <span class="font-black text-orange-500">KEEP</span> the mystery box, or <span class="font-black text-purple-500">GIVE</span> it away?' +
                '</p>' +
              '</div>' +
              '<div class="flex flex-col sm:flex-row justify-center gap-6">' +
                '<button onclick="handleDecision(' + currentTeamIdx + ')" class="flex-1 flex flex-col items-center justify-center gap-2 p-6 bg-orange-50 hover:bg-orange-100 text-orange-600 border-[3px] border-orange-400 rounded-3xl transition-all cursor-pointer shadow-sm hover:scale-105">' +
                  '<span class="font-black text-3xl">KEEP IT 🎁</span>' +
                  '<span class="text-xs font-bold opacity-80">(Applies to ' + escapeHtml(teams[currentTeamIdx].name) + ')</span>' +
                '</button>' +
                '<button onclick="handleDecision(' + nextTeamIdx + ')" class="flex-1 flex flex-col items-center justify-center gap-2 p-6 bg-purple-50 hover:bg-purple-100 text-purple-600 border-[3px] border-purple-400 rounded-3xl transition-all cursor-pointer shadow-sm hover:scale-105">' +
                  '<span class="font-black text-3xl">GIVE IT AWAY 🔄</span>' +
                  '<span class="text-xs font-bold opacity-80">(Applies to ' + escapeHtml(teams[nextTeamIdx].name) + ')</span>' +
                '</button>' +
              '</div>' +
            '</div>';
          } else if (modalStep === "target_selection") {
            const teamTargets = teams.map((t, i) => {
              if (i === targetTeamIdx) return '';
              return '<button onclick="handleOutcomeTarget(' + i + ')" class="px-8 py-4 bg-purple-500 text-white rounded-2xl font-black text-xl hover:bg-purple-600 transition-all cursor-pointer shadow-md">' + escapeHtml(t.name) + '</button>';
            }).join('');

            modalInner = '<div class="p-6 animate-pop-in">' +
              '<p class="text-xl font-black text-orange-500 uppercase tracking-widest mb-4">Target Selection</p>' +
              '<div class="mb-6 mx-auto w-full max-w-md ' + currentOutcome.color + ' rounded-3xl p-8 shadow-xl flex flex-col items-center gap-3 border-[6px] border-white">' +
                '<div class="bg-white/20 p-4 rounded-full">' + currentOutcome.icon + '</div>' +
                '<h3 class="text-4xl font-black text-white text-center">' + currentOutcome.text + '</h3>' +
              '</div>' +
              '<p class="text-lg font-bold text-slate-700 mb-6">Choose which team to target:</p>' +
              '<div class="flex justify-center gap-4">' +
                teamTargets +
              '</div>' +
            '</div>';
          } else if (modalStep === "reveal") {
            modalInner = '<div class="p-6 animate-pop-in">' +
              '<p class="text-xl font-black text-slate-400 uppercase tracking-widest mb-4">Mystery Box Revealed</p>' +
              '<div class="mb-6 mx-auto w-full max-w-md ' + currentOutcome.color + ' rounded-3xl p-8 shadow-2xl flex flex-col items-center gap-4 border-[6px] border-white animate-box-glow">' +
                '<div class="bg-white/20 p-5 rounded-full">' + currentOutcome.icon + '</div>' +
                '<h3 class="text-4xl sm:text-5xl font-black text-white text-center">' + currentOutcome.text + '</h3>' +
              '</div>' +
              '<p class="text-xl font-bold text-slate-700 mb-6">' +
                'Applied to: <span class="px-4 py-1.5 rounded-xl text-white font-black ' + getTeamStyle(targetTeamIdx).badge + '">' + escapeHtml(teams[targetTeamIdx].name) + '</span>' +
              '</p>' +
              '<button onclick="closeReveal()" class="px-12 py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl font-black text-2xl transition-all cursor-pointer shadow-lg hover:scale-105">' +
                'Continue' +
              '</button>' +
            '</div>';
          }

          modalHtml = '<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md overflow-y-auto">' +
            '<div class="bg-white border-[6px] ' + theme.modalBorder + ' rounded-[3rem] p-6 sm:p-10 max-w-5xl w-full shadow-2xl relative my-auto animate-pop-in">' +
              '<div class="absolute -top-12 left-1/2 -translate-x-1/2">' +
                '<div class="bg-gradient-to-br from-amber-400 to-orange-500 text-white w-24 h-24 rounded-full flex items-center justify-center text-5xl font-black shadow-xl border-[6px] border-white">' +
                  activeBoxNumber +
                '</div>' +
              '</div>' +
              '<div class="mt-8 text-center">' + modalInner + '</div>' +
              '<button onclick="activeBox=null; renderApp();" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors cursor-pointer">' +
                '<i data-lucide="x" class="w-6 h-6"></i>' +
              '</button>' +
            '</div>' +
          '</div>';
        }

        // Celebration Overlays
        let celebrationHtml = "";
        if (celebration === "win") {
          const items = ["🎉", "✨", "🎁", "🌟", "🏆", "💎"];
          const icons = Array.from({ length: 40 }).map(() => {
            const left = Math.floor(Math.random() * 100);
            const delay = (Math.random() * 0.4).toFixed(1);
            const dur = (1.5 + Math.random()).toFixed(1);
            const ic = items[Math.floor(Math.random() * items.length)];
            return '<div class="absolute text-5xl animate-float-up" style="left:' + left + '%;bottom:-10%;animation-delay:' + delay + 's;animation-duration:' + dur + 's">' + ic + '</div>';
          }).join('');
          celebrationHtml = '<div class="fixed inset-0 pointer-events-none z-[100] flex items-center justify-center overflow-hidden">' + icons + '</div>';
        } else if (celebration === "lose") {
          const items = ["🌧️", "💀", "📉", "⚡", "💣"];
          const drops = Array.from({ length: 30 }).map(() => {
            const left = Math.floor(Math.random() * 100);
            const delay = (Math.random() * 0.3).toFixed(1);
            const dur = (1.5 + Math.random()).toFixed(1);
            const ic = items[Math.floor(Math.random() * items.length)];
            return '<div class="absolute text-5xl animate-drop-down" style="left:' + left + '%;top:-10%;animation-delay:' + delay + 's;animation-duration:' + dur + 's">' + ic + '</div>';
          }).join('');
          celebrationHtml = '<div class="fixed inset-0 pointer-events-none z-[100] bg-red-950/20 flex items-center justify-center overflow-hidden">' + drops + '</div>';
        }

        // Game Over Modal
        let gameOverHtml = "";
        if (isGameOver) {
          const maxScore = Math.max(...teams.map(t => t.score));
          const winners = teams.filter(t => t.score === maxScore);
          const winnerText = winners.length > 1 
            ? ("It's a TIE between " + winners.map(w => w.name).join(' & ') + "!") 
            : (winners[0].name + " WINS!");

          gameOverHtml = '<div class="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">' +
            '<div class="bg-white rounded-[3rem] p-10 max-w-2xl w-full shadow-2xl relative flex flex-col items-center text-center border-[6px] border-amber-400 animate-pop-in">' +
              '<div class="text-7xl mb-4 animate-bounce">🏆</div>' +
              '<h2 class="text-4xl sm:text-5xl font-black text-slate-800 uppercase mb-2">' + escapeHtml(winnerText) + '</h2>' +
              '<p class="text-xl text-slate-500 font-bold mb-8">All ' + customQuestions.length + ' Mystery Boxes opened!</p>' +
              '<div class="flex gap-4 w-full">' +
                '<button onclick="resetGameScores()" class="flex-1 py-4 bg-orange-500 hover:bg-orange-600 text-white font-black text-xl rounded-2xl shadow-lg transition-all cursor-pointer">' +
                  'Play Again' +
                '</button>' +
                '<button onclick="setGameState(\'setup\')" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-white font-black text-xl rounded-2xl shadow-lg transition-all cursor-pointer">' +
                  'Game Setup' +
                '</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        }

        return '<div class="min-h-screen ' + theme.bgGame + ' pb-16 ' + shakeClass + '">' +
          '<header class="p-4 sm:p-6 bg-white/10 backdrop-blur-md shadow-lg border-b border-white/10 flex flex-col xl:flex-row justify-between items-center gap-4 z-10 relative">' +
            '<div class="flex items-center gap-3">' +
              '<button onclick="setGameState(\'setup\')" class="p-2.5 bg-white/15 hover:bg-white/25 text-white rounded-2xl transition-colors cursor-pointer" title="Return to Setup">' +
                '<i data-lucide="arrow-left" class="w-6 h-6"></i>' +
              '</button>' +
              '<div class="bg-amber-400 p-2.5 rounded-2xl shadow-lg shadow-amber-400/40">' +
                '<span class="text-2xl">' + theme.icon + '</span>' +
              '</div>' +
              '<h1 class="text-2xl sm:text-3xl font-black text-white drop-shadow-sm">Mystery Box</h1>' +
            '</div>' +

            '<div class="flex items-center justify-center gap-2 sm:gap-4 bg-white/5 p-2 sm:p-3 rounded-2xl border border-white/10 flex-wrap">' +
              teamsHeaderHtml +
            '</div>' +

            '<div class="flex items-center gap-3">' +
              '<button onclick="resetGameScores()" class="p-3 bg-white/10 text-white hover:bg-red-500 rounded-xl transition-colors cursor-pointer" title="Reset Scores">' +
                '<i data-lucide="refresh-cw" class="w-5 h-5"></i>' +
              '</button>' +
              '<button onclick="toggleSoundMute()" class="p-3 bg-white/10 text-white hover:bg-white/20 rounded-xl transition-colors cursor-pointer" title="Toggle Sound">' +
                '<i data-lucide="' + (!isMuted ? 'volume-2' : 'volume-x') + '" class="w-5 h-5"></i>' +
              '</button>' +
              '<button onclick="setGameState(\'setup\')" class="px-5 py-2.5 bg-white text-slate-900 hover:bg-slate-200 rounded-xl font-bold transition-all cursor-pointer shadow-md">' +
                'Setup' +
              '</button>' +
            '</div>' +
          '</header>' +

          '<main class="max-w-7xl mx-auto px-4 mt-8">' +
            '<div class="text-center mb-8">' +
              '<div class="inline-block bg-white/15 backdrop-blur-md border border-white/20 rounded-full py-2 px-6 shadow-xl transform transition-all hover:scale-105">' +
                '<h2 class="text-lg sm:text-2xl font-bold text-white flex items-center gap-3">' +
                  '<span class="px-5 py-1.5 rounded-full text-white font-black shadow-md ' + getTeamStyle(currentTeamIdx).badge + '">' +
                    escapeHtml(teams[currentTeamIdx] ? teams[currentTeamIdx].name.toUpperCase() : '') + ' TURN' +
                  '</span>' +
                  'Pick a Mystery Box! (1 - ' + customQuestions.length + ')' +
                '</h2>' +
              '</div>' +
            '</div>' +

            '<div class="grid ' + gridColsClass + ' gap-3 sm:gap-4 justify-center mx-auto">' +
              gridHtml +
            '</div>' +
          '</main>' +

          modalHtml +
          celebrationHtml +
          gameOverHtml +
        '</div>';
      }

      // --- MAIN APP ROUTER ---
      function renderApp() {
        const root = document.getElementById("app-root");
        if (!root) return;

        if (gameState === "editor") {
          root.innerHTML = renderEditorScreen();
        } else if (gameState === "study") {
          root.innerHTML = renderStudyScreen();
        } else if (gameState === "game") {
          root.innerHTML = renderGameScreen();
        } else {
          // Default: Setup Screen (same as Bubble Pop!)
          root.innerHTML = renderSetupScreen();
        }

        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }
      }

      // Initial Render
      renderApp();

      // --- POSTMESSAGE HANDLER (FROM REACT PARENT) ---
      window.addEventListener("message", (event) => {
        if (!event.data) return;

        if (event.data.type === "MEDIA_PICKED") {
          const { qIdx, oIdx, url } = event.data.data;
          if (customQuestions[qIdx]) {
            if (!customQuestions[qIdx].optionImages) {
              customQuestions[qIdx].optionImages = [null, null, null, null];
            }
            customQuestions[qIdx].optionImages[oIdx] = url;
            renderApp();
          }
          return;
        }

        if (event.data.type === "SET_FOLDERS") {
          availableFolders = event.data.data || [];
          if (gameState === "editor") renderApp();
          return;
        }

        if (event.data.type === "LOAD_MYSTERY_BOX") {
          const gameData = event.data.data;
          console.log("LOAD_MYSTERY_BOX received:", gameData);

          gameTopic = gameData.topic || gameData.name || "General Knowledge";
          gameClass = gameData.className || gameData.classLevel || "Grade 3";
          gameFolder = gameData.folder || "";
          gameTheme = gameData.theme || "theme-royal";
          gameDifficulty = gameData.difficulty || "normal";

          const rawQuestions = gameData.customQuestions || gameData.questions;
          if (rawQuestions && rawQuestions.length > 0) {
            // Strictly cap at 30 questions
            customQuestions = rawQuestions.slice(0, 30).map((q, i) => ({
              number: i + 1, // Numbered 1 to 30!
              type: "mcq",
              question: q.question || q.text || ("Question " + (i + 1)),
              options: q.options && q.options.length >= 2 ? q.options : ["Option 1", "Option 2", "Option 3", "Option 4"],
              correctOptionIndex: q.correctOptionIndex !== undefined ? q.correctOptionIndex : (q.answerIndex !== undefined ? q.answerIndex : 0),
              optionImages: q.optionImages || [null, null, null, null],
              answer: q.options ? (q.options[q.correctOptionIndex !== undefined ? q.correctOptionIndex : (q.answerIndex || 0)] || "") : ""
            }));
          } else {
            customQuestions = createDefaultQuestions(12);
          }

          if (gameData.teams && gameData.teams.length > 0) {
            teams = gameData.teams.map((t, idx) => ({ ...t, id: idx, score: 0 }));
            numPlayers = teams.length;
            p1Name = teams[0] ? teams[0].name : "Team 1";
            p2Name = teams[1] ? teams[1].name : "Team 2";
          } else {
            numPlayers = gameData.setupTeamCount || 1;
            p1Name = "Team 1";
            p2Name = "Team 2";
            if (numPlayers === 1) {
              teams = [{ id: 0, name: "Team 1", score: 0 }];
            } else {
              teams = [
                { id: 0, name: "Team 1", score: 0 },
                { id: 1, name: "Team 2", score: 0 }
              ];
            }
          }

          currentTeamIdx = 0;
          openedBoxes = [];
          activeBox = null;
          activeBoxNumber = null;
          selectedBoxAnimation = null;

          // If editMode is requested, open Editor; otherwise open Setup (same as Bubble Pop!)
          if (gameData.editMode) {
            gameState = "editor";
          } else {
            gameState = "setup";
          }
          renderApp();
        }
      });
    </script>
  </body>
</html>
