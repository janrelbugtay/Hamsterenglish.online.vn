<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>

    <!-- Glowing Rim -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Hat Gradients -->
    <radialGradient id="hatDome" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="55%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>

    <linearGradient id="veilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#f8fafc" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.15"/>
      <stop offset="75%" stop-color="#f8fafc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Fencing Sword Gradients -->
    <linearGradient id="swordBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="bellGuard" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <!-- Fruit Gradients -->
    <radialGradient id="melonFlesh" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="90%" stop-color="#9f1239"/>
    </radialGradient>

    <!-- Glove Gradients -->
    <linearGradient id="gloveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Slash Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Base Card with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Background Ambient Glow & Sparks -->
  <circle cx="140" cy="160" r="90" fill="#a855f7" opacity="0.25" filter="url(#glow)"/>
  <circle cx="370" cy="340" r="100" fill="#00d2ff" opacity="0.25" filter="url(#glow)"/>

  <!-- Volumetric Slash Arc -->
  <path d="M 60 410 Q 230 180 440 90" fill="none" stroke="#00f0ff" stroke-width="24" stroke-linecap="round" opacity="0.45" filter="url(#glow)"/>
  <path d="M 70 405 Q 235 185 435 95" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.95"/>

  <!-- ========================================== -->
  <!-- 1. MOSQUITO NET BEEKEEPER HAT (Top Left)   -->
  <!-- ========================================== -->
  <g transform="translate(145, 145) rotate(-8)" filter="url(#shadow)">
    <!-- Feather Plume -->
    <path d="M -40 -65 Q -85 -100 -115 -85 Q -100 -70 -120 -60 Q -95 -50 -40 -45 Z" fill="#2e1065" stroke="#1f1042" stroke-width="3"/>
    
    <!-- Hat Dome -->
    <path d="M -65 -25 C -65 -85, 65 -85, 65 -25 Z" fill="url(#hatDome)" stroke="#1f1042" stroke-width="4"/>
    
    <!-- Gold Buckle & Band -->
    <path d="M -66 -35 Q 0 -44 66 -35 L 68 -22 Q 0 -31 -68 -22 Z" fill="#4a1d24" stroke="#1f1042" stroke-width="3"/>
    <rect x="18" y="-36" width="24" height="14" rx="2" fill="#fbbf24" stroke="#78350f" stroke-width="2"/>

    <!-- Wide Brim -->
    <path d="M -105 -15 Q 0 -45 105 -15 Q 110 -5 95 -5 Q 0 -28 -95 -5 Z" fill="#7e22ce" stroke="#1f1042" stroke-width="4"/>

    <!-- Translucent Mosquito Net Veil -->
    <path d="M -85 -10 L -75 75 Q 0 95 75 75 L 85 -10 Q 0 -22 -85 -10 Z" fill="url(#veilGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    
    <!-- Net Grid Lines -->
    <line x1="-55" y1="-8" x2="-50" y2="78" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <line x1="-25" y1="-12" x2="-22" y2="82" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <line x1="5" y1="-14" x2="5" y2="84" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <line x1="35" y1="-12" x2="32" y2="82" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <line x1="65" y1="-8" x2="60" y2="78" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <path d="M -78 20 Q 0 35 78 20" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>
    <path d="M -75 48 Q 0 65 75 48" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>

    <!-- Rolled Net Bottom Rim -->
    <path d="M -78 72 Q 0 94 78 72 Q 82 84 72 88 Q 0 108 -72 88 Z" fill="#6b21a8" stroke="#1f1042" stroke-width="3"/>

    <!-- Cute Round Badge -->
    <circle cx="-38" cy="-30" r="14" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
    <circle cx="-38" cy="-30" r="5" fill="#1e1b4b"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. BUZZING CUTE MOSQUITO (Center Left)     -->
  <!-- ========================================== -->
  <g transform="translate(115, 335) rotate(14)" filter="url(#shadow)">
    <!-- Wings -->
    <ellipse cx="25" cy="-28" rx="28" ry="11" transform="rotate(-25 25 -28)" fill="#bae6fd" opacity="0.85" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="14" cy="-24" rx="22" ry="9" transform="rotate(20 14 -24)" fill="#bae6fd" opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Legs -->
    <path d="M 0 10 L -12 28 L -18 42 M 14 10 L 12 28 L 18 44 M 28 8 L 36 24 L 46 36" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Striped Abdomen -->
    <ellipse cx="32" cy="4" rx="26" ry="14" transform="rotate(12 32 4)" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <rect x="22" y="-6" width="5" height="18" rx="2" fill="#a855f7"/>
    <rect x="33" y="-5" width="5" height="18" rx="2" fill="#a855f7"/>
    <rect x="44" y="-3" width="5" height="16" rx="2" fill="#a855f7"/>

    <!-- Thorax & Head -->
    <circle cx="2" cy="-2" r="15" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <circle cx="-16" cy="-4" r="12" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>

    <!-- Red Cartoon Eye & Glint -->
    <circle cx="-20" cy="-8" r="7" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="-21" cy="-8" r="4.5" fill="#ef4444"/>
    <circle cx="-22.5" cy="-9.5" r="1.8" fill="#ffffff"/>

    <!-- Proboscis -->
    <path d="M -26 -4 L -48 -1" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Purple Clapping Glove holding answer pill -->
    <g transform="translate(10, 4) scale(0.65)">
      <path d="M -15 25 Q -20 20 -15 15 Q -16 -2 -16 -25 C -16 -35, -5 -35, -5 -25 C -5 -37, 5 -37, 5 -24 C 5 -34, 15 -30, 15 -18 Q 16 0 17 15 Q 20 20 15 25 Z" fill="url(#gloveGrad)" stroke="#1f1042" stroke-width="3.5"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. SLICED JUICY WATERMELON (Center Right)  -->
  <!-- ========================================== -->
  <g transform="translate(370, 310) rotate(-16)" filter="url(#shadow)">
    <!-- Top Halved Slice flying upwards -->
    <g transform="translate(-12, -22) rotate(-12)">
      <!-- Green Rind -->
      <path d="M -60 0 A 60 60 0 0 1 60 0 Z" fill="#15803d" stroke="#4ade80" stroke-width="4"/>
      <!-- White Pith -->
      <path d="M -54 0 A 54 54 0 0 1 54 0 Z" fill="#fecdd3"/>
      <!-- Red Juicy Flesh -->
      <path d="M -48 0 A 48 48 0 0 1 48 0 Z" fill="url(#melonFlesh)"/>
      <!-- Seeds -->
      <ellipse cx="-22" cy="-14" rx="2.5" ry="4" transform="rotate(-25 -22 -14)" fill="#0f172a"/>
      <ellipse cx="0" cy="-24" rx="2.5" ry="4" fill="#0f172a"/>
      <ellipse cx="22" cy="-14" rx="2.5" ry="4" transform="rotate(25 22 -14)" fill="#0f172a"/>
      <!-- Juicy Shine -->
      <ellipse cx="-16" cy="-28" rx="8" ry="4" transform="rotate(-30 -16 -28)" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Bottom Halved Slice rolling down -->
    <g transform="translate(18, 22) rotate(16)">
      <!-- Green Rind -->
      <path d="M -55 0 A 55 55 0 0 0 55 0 Z" fill="#15803d" stroke="#4ade80" stroke-width="4"/>
      <!-- Red Flesh -->
      <path d="M -44 0 A 44 44 0 0 0 44 0 Z" fill="url(#melonFlesh)"/>
      <!-- Seeds -->
      <ellipse cx="-18" cy="12" rx="2.5" ry="4" transform="rotate(25 -18 12)" fill="#0f172a"/>
      <ellipse cx="0" cy="20" rx="2.5" ry="4" fill="#0f172a"/>
      <ellipse cx="18" cy="12" rx="2.5" ry="4" transform="rotate(-25 18 12)" fill="#0f172a"/>
    </g>

    <!-- Splash Juice Droplets -->
    <circle cx="-5" cy="-2" r="5" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="28" cy="-35" r="4" fill="#fb7185"/>
    <circle cx="-42" cy="18" r="4.5" fill="#f43f5e"/>
    <circle cx="48" cy="8" r="3.5" fill="#fb7185"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. GLEAMING 3D FENCING SWORD (Sabre / Foil)-->
  <!-- ========================================== -->
  <g transform="translate(230, 270) rotate(-42)" filter="url(#shadow)">
    <!-- Long Tapered Gleaming Steel Blade -->
    <polygon points="12,-6 260,-1 275,0 260,1 12,6" fill="url(#swordBlade)"/>
    <line x1="16" y1="0" x2="265" y2="0" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Bell Guard (Cup Hilt) -->
    <path d="M 14 -32 C -18 -30, -18 30, 14 32 Q 22 0 14 -32 Z" fill="url(#bellGuard)" stroke="#334155" stroke-width="3"/>
    <ellipse cx="14" cy="0" rx="4.5" ry="32" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>

    <!-- Knuckle-Bow Guard Loop -->
    <path d="M 6 30 C -20 52, -72 38, -82 6" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>

    <!-- Ribbed Handle Grip -->
    <rect x="-78" y="-8" width="65" height="16" rx="5" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
    <line x1="-60" y1="-7" x2="-60" y2="7" stroke="#4b5563" stroke-width="2"/>
    <line x1="-45" y1="-7" x2="-45" y2="7" stroke="#4b5563" stroke-width="2"/>
    <line x1="-30" y1="-7" x2="-30" y2="7" stroke="#4b5563" stroke-width="2"/>

    <!-- Spherical Pommel -->
    <circle cx="-86" cy="0" r="10" fill="#94a3b8" stroke="#334155" stroke-width="2.5"/>

    <!-- Star Glint at the Tip -->
    <g transform="translate(275, 0) scale(1.6)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#ffffff" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 5. VIBRANT GAME TITLE BANNER AT BOTTOM     -->
  <!-- ========================================== -->
  <g transform="translate(256, 452)" filter="url(#shadow)">
    <!-- Pill Backplate -->
    <rect x="-185" y="-28" width="370" height="56" rx="28" fill="#0f172a" stroke="#c084fc" stroke-width="3.5"/>
    <rect x="-180" y="-23" width="360" height="46" rx="23" fill="url(#bgGrad)" opacity="0.9"/>
    
    <!-- Title Text -->
    <text x="0" y="8" font-family="'Fredoka', 'Inter', system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle" fill="#ffffff" letter-spacing="1">
      SLAP &amp; CHOP
    </text>

    <!-- Side Emojis/Badges -->
    <circle cx="-145" cy="0" r="17" fill="#a855f7"/>
    <text x="-145" y="6" font-size="18" text-anchor="middle">🦟</text>

    <circle cx="145" cy="0" r="17" fill="#f97316"/>
    <text x="145" y="6" font-size="18" text-anchor="middle">🤺</text>
  </g>
</svg>
