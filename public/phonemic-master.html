<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonemic Master</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom styles for animations and specific layout tweaks */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #bae6fd; /* Sky 200 */
            color: #0f172a;
            overflow-x: hidden;
        }

        .chart-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .chart-scrollbar::-webkit-scrollbar-track {
            background: rgba(4, 120, 87, 0.2); 
            border-radius: 4px;
        }
        .chart-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.5); 
            border-radius: 4px;
        }
        .chart-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.8); 
        }

        /* Mastery Glows */
        .mastery-gold {
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
            border-color: rgba(251, 191, 36, 0.8) !important;
        }
        .mastery-green {
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
            border-color: rgba(52, 211, 153, 0.6) !important;
        }

        /* Waveform Animation */
        .waveform-bar {
            transition: height 0.05s ease-out;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .recording-pulse::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background-color: rgba(239, 68, 68, 0.5);
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const PHONEMES = [
            // MONOPHTHONGS (Row 1)
            { id: 'v_i_long', symbol: '/iː/', word: 'sheep', cat: 'monophthong', group: 'vowel', tip: 'Long vowel. Tongue high and forward. Smile slightly.' },
            { id: 'v_i_short', symbol: '/ɪ/', word: 'ship', cat: 'monophthong', group: 'vowel', tip: 'Short vowel. Tongue slightly lower than /iː/. Relaxed lips.' },
            { id: 'v_u_short', symbol: '/ʊ/', word: 'good', cat: 'monophthong', group: 'vowel', tip: 'Short vowel. Back of tongue high. Lips slightly rounded.' },
            { id: 'v_u_long', symbol: '/uː/', word: 'shoot', cat: 'monophthong', group: 'vowel', tip: 'Long vowel. Back of tongue high. Lips tightly rounded.' },
            
            // MONOPHTHONGS (Row 2)
            { id: 'v_e', symbol: '/e/', word: 'bed', cat: 'monophthong', group: 'vowel', tip: 'Short vowel. Tongue mid-height, forward. Relaxed lips.' },
            { id: 'v_schwa', symbol: '/ə/', word: 'teacher', cat: 'monophthong', group: 'vowel', tip: 'The schwa. Very relaxed, central, short vowel. Most common sound.' },
            { id: 'v_er', symbol: '/ɜː/', word: 'bird', cat: 'monophthong', group: 'vowel', tip: 'Long central vowel. Tongue mid-height. Neutral lips.' },
            { id: 'v_or', symbol: '/ɔː/', word: 'door', cat: 'monophthong', group: 'vowel', tip: 'Long vowel. Back of tongue mid-low. Lips rounded.' },
            
            // MONOPHTHONGS (Row 3)
            { id: 'v_a', symbol: '/æ/', word: 'cat', cat: 'monophthong', group: 'vowel', tip: 'Short vowel. Tongue low and forward. Mouth open wide.' },
            { id: 'v_uh', symbol: '/ʌ/', word: 'up', cat: 'monophthong', group: 'vowel', tip: 'Short vowel. Tongue low-mid, central. Mouth fairly open.' },
            { id: 'v_ah', symbol: '/ɑː/', word: 'far', cat: 'monophthong', group: 'vowel', tip: 'Long vowel. Tongue low and back. Mouth fully open.' },
            { id: 'v_o', symbol: '/ɒ/', word: 'on', cat: 'monophthong', group: 'vowel', tip: 'Short vowel. Tongue low and back. Lips slightly rounded.' },

            // DIPHTHONGS (Row 1)
            { id: 'd_ia', symbol: '/ɪə/', word: 'here', cat: 'diphthong', group: 'vowel', tip: 'Glides from /ɪ/ to /ə/. Tongue moves from high front to central.' },
            { id: 'd_ei', symbol: '/eɪ/', word: 'wait', cat: 'diphthong', group: 'vowel', tip: 'Glides from /e/ to /ɪ/. Smile slightly as you finish the sound.' },
            { id: 'd_ua', symbol: '/ʊə/', word: 'cure', cat: 'diphthong', group: 'vowel', tip: 'Glides from /ʊ/ to /ə/. Lips move from rounded to neutral.' },
            
            // DIPHTHONGS (Row 2)
            { id: 'd_oi', symbol: '/ɔɪ/', word: 'boy', cat: 'diphthong', group: 'vowel', tip: 'Glides from rounded /ɔː/ to spread /ɪ/.' },
            { id: 'd_ou', symbol: '/əʊ/', word: 'show', cat: 'diphthong', group: 'vowel', tip: 'Glides from neutral /ə/ to rounded /ʊ/.' },
            
            // DIPHTHONGS (Row 3)
            { id: 'd_ea', symbol: '/eə/', word: 'hair', cat: 'diphthong', group: 'vowel', tip: 'Glides from /e/ to /ə/. Mouth stays fairly open.' },
            { id: 'd_ai', symbol: '/aɪ/', word: 'my', cat: 'diphthong', group: 'vowel', tip: 'Glides from open /a/ to high /ɪ/. Jaw moves up.' },
            { id: 'd_au', symbol: '/aʊ/', word: 'cow', cat: 'diphthong', group: 'vowel', tip: 'Glides from open /a/ to rounded /ʊ/. Lips round at the end.' },

            // CONSONANTS (Row 1)
            { id: 'c_p', symbol: '/p/', word: 'pea', cat: 'consonant', group: 'consonant', tip: 'Voiceless. Lips together, then release air suddenly.' },
            { id: 'c_f', symbol: '/f/', word: 'fly', cat: 'consonant', group: 'consonant', tip: 'Voiceless. Top teeth on bottom lip. Push air through.' },
            { id: 'c_t', symbol: '/t/', word: 'tea', cat: 'consonant', group: 'consonant', tip: 'Voiceless. Tongue tip on the bumpy ridge behind top teeth.' },
            { id: 'c_th_un', symbol: '/θ/', word: 'think', cat: 'consonant', group: 'consonant', tip: 'Voiceless. Tongue tip gently between teeth. Blow air.' },
            { id: 'c_ch', symbol: '/ʧ/', word: 'cheese', cat: 'consonant', group: 'consonant', tip: 'Voiceless. Starts like /t/ then releases into /ʃ/.' },
            { id: 'c_s', symbol: '/s/', word: 'see', cat: 'consonant', group: 'consonant', tip: 'Voiceless. Tongue close to the tooth ridge. Hissing sound.' },
            { id: 'c_sh', symbol: '/ʃ/', word: 'shall', cat: 'consonant', group: 'consonant', tip: 'Voiceless. Tongue slightly further back than /s/. Lips slightly rounded ("shh").' },
            { id: 'c_k', symbol: '/k/', word: 'car', cat: 'consonant', group: 'consonant', tip: 'Voiceless. Back of tongue touches soft palate. Release air.' },

            // CONSONANTS (Row 2)
            { id: 'c_b', symbol: '/b/', word: 'boat', cat: 'consonant', group: 'consonant', tip: 'Voiced. Lips together, voice on, release.' },
            { id: 'c_v', symbol: '/v/', word: 'video', cat: 'consonant', group: 'consonant', tip: 'Voiced. Top teeth on bottom lip. Voice on.' },
            { id: 'c_d', symbol: '/d/', word: 'dog', cat: 'consonant', group: 'consonant', tip: 'Voiced. Tongue tip on ridge behind top teeth.' },
            { id: 'c_th_v', symbol: '/ð/', word: 'this', cat: 'consonant', group: 'consonant', tip: 'Voiced. Tongue tip between teeth. Voice on.' },
            { id: 'c_j', symbol: '/ʤ/', word: 'June', cat: 'consonant', group: 'consonant', tip: 'Voiced. Starts like /d/ and releases into /ʒ/.' },
            { id: 'c_z', symbol: '/z/', word: 'zoo', cat: 'consonant', group: 'consonant', tip: 'Voiced. Like /s/, but with your voice vibrating (buzzing).' },
            { id: 'c_zh', symbol: '/ʒ/', word: 'television', cat: 'consonant', group: 'consonant', tip: 'Voiced. Like /ʃ/ but with voice on.' },
            { id: 'c_g', symbol: '/g/', word: 'go', cat: 'consonant', group: 'consonant', tip: 'Voiced. Back of tongue to soft palate.' },

            // CONSONANTS (Row 3)
            { id: 'c_h', symbol: '/h/', word: 'hat', cat: 'consonant', group: 'consonant', tip: 'Voiceless. Push air from throat. Mouth relaxed.' },
            { id: 'c_m', symbol: '/m/', word: 'man', cat: 'consonant', group: 'consonant', tip: 'Voiced. Lips closed. Air flows through nose.' },
            { id: 'c_n', symbol: '/n/', word: 'now', cat: 'consonant', group: 'consonant', tip: 'Voiced. Tongue tip on tooth ridge. Air through nose.' },
            { id: 'c_ng', symbol: '/ŋ/', word: 'singer', cat: 'consonant', group: 'consonant', tip: 'Voiced. Back of tongue touches soft palate. Air through nose.' },
            { id: 'c_r', symbol: '/r/', word: 'red', cat: 'consonant', group: 'consonant', tip: 'Voiced. Tongue tip curls back slightly, not touching roof.' },
            { id: 'c_l', symbol: '/l/', word: 'love', cat: 'consonant', group: 'consonant', tip: 'Voiced. Tongue tip touches tooth ridge, air flows around sides.' },
            { id: 'c_w', symbol: '/w/', word: 'wet', cat: 'consonant', group: 'consonant', tip: 'Voiced. Lips rounded tightly then open. Back of tongue high.' },
            { id: 'c_j_y', symbol: '/j/', word: 'yes', cat: 'consonant', group: 'consonant', tip: 'Voiced. Tongue high and forward, glides to next vowel.' },
        ];

        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons (Simulated Lucide) ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Volume2: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`,
                Mic: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>`,
                X: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><line x1="18" x2="6" y1="6" y2="18"></line><line x1="6" x2="18" y1="6" y2="18"></line></svg>`,
                Check: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
                AlertCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>`,
                Flame: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>`,
                Award: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>`,
                Play: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
                RotateCcw: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>`
            };
            return <div dangerouslySetInnerHTML={{ __html: icons[name] }} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} />;
        };

        // --- Simulated Pronunciation Analyzer ---
        // Since we can't reliably do raw phoneme acoustic analysis purely client-side without heavy WASM models,
        // we use standard Web Speech Recognition and simulate the complex analysis based on text matching and confidence.
        const analyzePronunciation = (detectedText, targetWord, confidence) => {
            if (!detectedText) return { error: "No speech detected. Please try again." };
            
            const cleanDetected = detectedText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();
            const cleanTarget = targetWord.toLowerCase().trim();
            
            let overallScore = 0;
            let wordScore = 0;
            let soundScore = 0;
            let status = 'poor'; // poor, ok, great
            let feedback = '';

            if (cleanDetected === cleanTarget) {
                // Perfect word match
                wordScore = Math.floor(95 + (Math.random() * 5)); 
                soundScore = Math.floor(90 + (Math.random() * 10)); // Assume phoneme was good if word is perfect
                overallScore = Math.round((wordScore + soundScore) / 2);
                status = 'great';
                feedback = "Excellent! Your pronunciation was very clear.";
            } else if (cleanDetected.includes(cleanTarget) || cleanTarget.includes(cleanDetected)) {
                // Partial match or captured extra words
                wordScore = Math.floor(80 + (Math.random() * 10));
                soundScore = Math.floor(75 + (Math.random() * 15));
                overallScore = Math.round((wordScore + soundScore) / 2);
                status = 'ok';
                feedback = `Almost there! The system heard "${cleanDetected}". Make sure to isolate the word.`;
            } else {
                // Calculate basic similarity (mocking Levenshtein for simplicity in single file)
                // If it starts with the same letter, give some points
                let similarity = 30;
                if (cleanDetected[0] === cleanTarget[0]) similarity += 20;
                if (cleanDetected.length === cleanTarget.length) similarity += 10;
                
                wordScore = similarity + Math.floor(Math.random() * 20);
                soundScore = Math.max(20, similarity - 10 + Math.floor(Math.random() * 20)); // Assume specific target sound was missed
                overallScore = Math.round((wordScore + soundScore) / 2);
                status = overallScore > 65 ? 'ok' : 'poor';
                
                feedback = `Let's try again. The system heard something closer to "${cleanDetected}". Focus on the target sound.`;
            }

            // Adjust by confidence if available
            if (confidence && confidence < 0.5) {
                overallScore = Math.max(10, overallScore - 15);
                feedback += " (Audio was a bit unclear, try speaking closer to the mic).";
            }

            return {
                overallScore,
                wordScore,
                soundScore,
                status,
                feedback,
                detectedText: cleanDetected
            };
        };

        const useTextToSpeech = () => {
            const playAudio = useCallback((text, rate = 1.0) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // Stop current
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-GB'; // British English for standard chart usually
                    utterance.rate = rate;
                    window.speechSynthesis.speak(utterance);
                }
            }, []);
            return playAudio;
        };

        // Real-time Audio Waveform component
        const AudioWaveform = ({ stream }) => {
            const canvasRef = useRef(null);
            const requestRef = useRef(null);
            const audioCtxRef = useRef(null);
            const analyserRef = useRef(null);
            const sourceRef = useRef(null);

            useEffect(() => {
                if (!stream || !canvasRef.current) return;

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                // Initialize Audio Context
                audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                analyserRef.current = audioCtxRef.current.createAnalyser();
                analyserRef.current.fftSize = 64; // Small size for simple bars
                
                sourceRef.current = audioCtxRef.current.createMediaStreamSource(stream);
                sourceRef.current.connect(analyserRef.current);

                const bufferLength = analyserRef.current.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                const draw = () => {
                    requestRef.current = requestAnimationFrame(draw);
                    analyserRef.current.getByteFrequencyData(dataArray);

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    const barWidth = (canvas.width / bufferLength) * 1.5;
                    let x = 0;

                    for(let i = 0; i < bufferLength; i++) {
                        // Soften the bars
                        const barHeight = (dataArray[i] / 255) * canvas.height * 0.8;
                        
                        ctx.fillStyle = `rgba(52, 211, 153, ${0.4 + (barHeight / canvas.height)})`; // Emerald green
                        
                        // Draw from center vertically
                        const y = (canvas.height - barHeight) / 2;
                        
                        // Rounded caps (approximate with small rects or arc, sticking to simple rect for performance)
                        ctx.fillRect(x, y, barWidth - 2, barHeight);
                        x += barWidth;
                    }
                };

                draw();

                return () => {
                    cancelAnimationFrame(requestRef.current);
                    if (sourceRef.current) sourceRef.current.disconnect();
                    if (audioCtxRef.current) audioCtxRef.current.close();
                };
            }, [stream]);

            return (
                <canvas 
                    ref={canvasRef} 
                    width="200" 
                    height="60" 
                    className="w-full h-16 rounded bg-sky-950/50"
                />
            );
        };

        const PhonemeCard = ({ phoneme, onSelect, progress }) => {
            // Determine visual status based on progress
            let statusClass = "bg-sky-900 border-sky-700/50 hover:bg-sky-800 hover:border-sky-500/80";
            let textColor = "text-white";
            
            if (progress) {
                if (progress.mastered) {
                    statusClass = "bg-sky-800 border-amber-400 mastery-gold";
                    textColor = "text-amber-300";
                } else if (progress.bestScore >= 80) {
                    statusClass = "bg-sky-800 border-sky-400 mastery-green";
                } else if (progress.attempts > 0) {
                    statusClass = "bg-sky-800 border-yellow-500/50"; // Practicing
                }
            }

            return (
                <div 
                    onClick={() => onSelect(phoneme)}
                    className={`relative flex flex-col items-center justify-center p-3 rounded-xl border-2 cursor-pointer transition-all duration-200 hover:scale-[1.03] group ${statusClass} min-h-[90px]`}
                >
                    {progress?.mastered && (
                        <div className="absolute top-1 right-1 text-amber-400">
                            <Icon name="Award" size={14} />
                        </div>
                    )}
                    <span className={`text-2xl font-bold mb-1 ${textColor}`}>{phoneme.symbol}</span>
                    <span className="text-xs text-sky-100/70 group-hover:text-sky-100 transition-colors">
                        {phoneme.word}
                    </span>
                    <div className="absolute bottom-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity text-sky-400">
                        <Icon name="Volume2" size={14} />
                    </div>
                </div>
            );
        };

        const PracticePanel = ({ phoneme, onClose, onResult, currentProgress }) => {
            const playAudio = useTextToSpeech();
            const [recordingState, setRecordingState] = useState('idle'); // idle, recording, analyzing, result
            const [stream, setStream] = useState(null);
            const [recognition, setRecognition] = useState(null);
            const [result, setResult] = useState(null);
            const [timeoutId, setTimeoutId] = useState(null);

            // Initialize Speech Recognition
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const rec = new SpeechRecognition();
                    rec.continuous = false;
                    rec.interimResults = false;
                    rec.lang = 'en-US'; // Use general English to catch broad pronunciation
                    
                    rec.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        const confidence = event.results[0][0].confidence;
                        handleSpeechResult(transcript, confidence);
                    };

                    rec.onerror = (event) => {
                        console.error("Speech recognition error", event.error);
                        stopRecordingFlow();
                        setResult({ error: `Mic error: ${event.error}. Please try again.` });
                        setRecordingState('result');
                    };
                    
                    rec.onnomatch = () => {
                        stopRecordingFlow();
                        setResult({ error: "No speech detected confidently." });
                        setRecordingState('result');
                    }

                    setRecognition(rec);
                } else {
                    setResult({ error: "Speech recognition not supported in this browser. Please use Chrome." });
                    setRecordingState('result');
                }

                return () => {
                    if (stream) stream.getTracks().forEach(track => track.stop());
                };
            }, []);

            const stopRecordingFlow = useCallback(() => {
                if (recognition) {
                    try { recognition.stop(); } catch(e){}
                }
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    setStream(null);
                }
                if (timeoutId) clearTimeout(timeoutId);
            }, [recognition, stream, timeoutId]);

            const handleSpeechResult = (text, confidence) => {
                setRecordingState('analyzing');
                stopRecordingFlow();
                
                // Simulate a slight delay for "processing" feel
                setTimeout(() => {
                    const analysis = analyzePronunciation(text, phoneme.word, confidence);
                    setResult(analysis);
                    setRecordingState('result');
                    if (onResult && !analysis.error) {
                        onResult(phoneme.id, analysis.overallScore);
                    }
                }, 800);
            };

            const startRecording = async () => {
                if (recordingState === 'recording') {
                    // Manual stop
                    stopRecordingFlow();
                    return;
                }
                
                setResult(null);
                try {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    setStream(audioStream);
                    setRecordingState('recording');
                    
                    if (recognition) {
                        try {
                            recognition.start();
                        } catch (e) {
                            console.error("Rec start error", e);
                            // Sometimes it's already started, just restart
                            recognition.stop();
                            setTimeout(() => recognition.start(), 100);
                        }
                    }

                    // Auto-stop after 4 seconds to prevent hanging
                    const id = setTimeout(() => {
                        if (recordingState === 'recording') {
                            stopRecordingFlow();
                            setResult({ error: "Recording timed out. Please try speaking clearly." });
                            setRecordingState('result');
                        }
                    }, 4000);
                    setTimeoutId(id);

                } catch (err) {
                    console.error("Mic access denied", err);
                    setResult({ error: "Microphone access denied. Please allow it in your browser settings." });
                    setRecordingState('result');
                }
            };

            // Cleanup on unmount
            useEffect(() => {
                return () => stopRecordingFlow();
            }, [stopRecordingFlow]);

            const handlePlay = (rate) => {
                playAudio(phoneme.word, rate);
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-sky-900 border border-sky-700/50 rounded-2xl w-full max-w-md shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                        
                        {/* Header */}
                        <div className="flex justify-between items-center p-4 border-b border-sky-800">
                            <div className="flex items-center space-x-2 text-sky-200">
                                <span className="uppercase text-xs font-bold tracking-wider">{phoneme.cat}</span>
                            </div>
                            <button onClick={onClose} className="p-1 hover:bg-sky-800 rounded-full text-sky-400 transition-colors">
                                <Icon name="X" />
                            </button>
                        </div>

                        {/* Target Area */}
                        <div className="p-8 flex flex-col items-center text-center">
                            <h2 className="text-6xl font-bold text-white mb-2 drop-shadow-md">{phoneme.symbol}</h2>
                            <p className="text-2xl text-sky-200 font-light mb-6">"{phoneme.word}"</p>
                            
                            <div className="flex space-x-4 mb-8">
                                <button 
                                    onClick={() => handlePlay(1.0)}
                                    className="flex items-center px-4 py-2 bg-sky-800 hover:bg-sky-700 rounded-full text-white shadow-lg transition-all active:scale-95"
                                >
                                    <Icon name="Volume2" size={18} className="mr-2" /> Listen
                                </button>
                                <button 
                                    onClick={() => handlePlay(0.5)}
                                    className="flex items-center px-4 py-2 bg-sky-950 hover:bg-sky-800 border border-sky-700 rounded-full text-sky-300 transition-all active:scale-95"
                                >
                                    🐢 Slow
                                </button>
                            </div>

                            {/* Coach Info */}
                            <div className="bg-sky-950/50 rounded-xl p-4 w-full text-left text-sm text-sky-100 border border-sky-800/50 mb-6">
                                <strong className="text-sky-400 block mb-1 flex items-center"><Icon name="Check" size={16} className="mr-1"/> Tip</strong>
                                {phoneme.tip}
                            </div>

                            {/* Recording Area */}
                            <div className="w-full flex flex-col items-center">
                                {recordingState === 'recording' && (
                                    <div className="w-full mb-4">
                                        <AudioWaveform stream={stream} />
                                        <p className="text-red-400 text-sm mt-2 animate-pulse text-center">Recording...</p>
                                    </div>
                                )}
                                
                                {recordingState === 'analyzing' && (
                                    <div className="w-full mb-4 py-4 flex justify-center">
                                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-amber-400"></div>
                                    </div>
                                )}

                                {recordingState === 'result' && result && (
                                    <div className={`w-full mb-6 p-4 rounded-xl border ${result.error ? 'bg-red-950/30 border-red-800 text-red-200' : 'bg-sky-950/50 border-sky-700'} transition-all`}>
                                        {result.error ? (
                                            <div className="flex items-start">
                                                <Icon name="AlertCircle" size={20} className="mr-2 shrink-0 mt-0.5" />
                                                <span className="text-sm">{result.error}</span>
                                            </div>
                                        ) : (
                                            <div>
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-gray-300">Overall Score</span>
                                                    <span className={`text-2xl font-bold ${result.overallScore >= 90 ? 'text-amber-400' : result.overallScore >= 70 ? 'text-sky-400' : 'text-yellow-500'}`}>
                                                        {result.overallScore}%
                                                    </span>
                                                </div>
                                                
                                                {/* Progress bar */}
                                                <div className="w-full bg-sky-900 rounded-full h-2 mb-4">
                                                    <div className="bg-gradient-to-r from-sky-500 to-amber-400 h-2 rounded-full" style={{ width: `${result.overallScore}%` }}></div>
                                                </div>

                                                <div className="flex justify-between text-xs text-sky-200/70 mb-4 px-2">
                                                    <span>Sound: <span className="font-semibold text-sky-100">{result.soundScore}%</span></span>
                                                    <span>Word: <span className="font-semibold text-sky-100">{result.wordScore}%</span></span>
                                                </div>
                                                
                                                <p className="text-sm text-center text-sky-100 mt-2 italic border-t border-sky-800/50 pt-2">
                                                    "{result.feedback}"
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <button 
                                    onClick={startRecording}
                                    className={`relative flex items-center justify-center w-16 h-16 rounded-full text-white shadow-xl transition-all duration-300 active:scale-90
                                        ${recordingState === 'recording' 
                                            ? 'bg-red-500 hover:bg-red-600 recording-pulse' 
                                            : recordingState === 'analyzing'
                                            ? 'bg-sky-800 cursor-not-allowed opacity-50'
                                            : 'bg-gradient-to-br from-sky-500 to-sky-700 hover:from-sky-400 hover:to-sky-600'}`}
                                    disabled={recordingState === 'analyzing'}
                                >
                                    {recordingState === 'recording' ? <div className="w-6 h-6 bg-white rounded-sm" /> : <Icon name="Mic" size={28} />}
                                </button>
                                {recordingState !== 'recording' && (
                                    <span className="text-xs text-sky-400 mt-2 font-medium tracking-wide">YOUR TURN</span>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedPhoneme, setSelectedPhoneme] = useState(null);
            
            // State: Progress Tracking
            const [progress, setProgress] = useState({});
            const [stats, setStats] = useState({ xp: 0, streak: 0, lastPracticedDate: null });

            // Initialize progress logic
            const handleResult = (phonemeId, score) => {
                setProgress(prev => {
                    const current = prev[phonemeId] || { attempts: 0, bestScore: 0, history: [] };
                    const newHistory = [...current.history, score].slice(-5); // Keep last 5
                    
                    const avgRecent = newHistory.reduce((a, b) => a + b, 0) / newHistory.length;
                    
                    // Mastery logic: Best >= 90, Avg recent >= 85, at least 3 attempts
                    const mastered = Math.max(current.bestScore, score) >= 90 && avgRecent >= 85 && current.attempts + 1 >= 3;

                    return {
                        ...prev,
                        [phonemeId]: {
                            attempts: current.attempts + 1,
                            bestScore: Math.max(current.bestScore, score),
                            history: newHistory,
                            mastered: mastered
                        }
                    };
                });

                // Update XP & Streak
                setStats(prev => {
                    let xpGain = 5; // Base attempt
                    if (score >= 95) xpGain += 35;
                    else if (score >= 90) xpGain += 20;
                    else if (score >= 80) xpGain += 10;
                    
                    let newStreak = prev.streak;
                    const today = new Date().toDateString();
                    
                    if (score >= 80) {
                        if (prev.lastPracticedDate !== today) {
                            newStreak += 1;
                        }
                    } else if (score < 50) {
                        // Reset streak if completely wrong to keep it challenging (optional, leaving out to be nice)
                    }

                    return {
                        xp: prev.xp + xpGain,
                        streak: newStreak,
                        lastPracticedDate: today
                    };
                });
            };

            const masteredCount = Object.values(progress).filter(p => p.mastered).length;

            return (
                <div className="min-h-screen flex flex-col items-center pt-8 pb-16 px-4">
                    
                    {/* Bubble Island Background */}
                    <div className="fixed inset-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
                        {/* Sun */}
                        <div className="absolute top-[-5%] right-[-5%] w-48 h-48 bg-yellow-300 rounded-full blur-[4px]"></div>
                        {/* Clouds */}
                        <div className="absolute top-[15%] left-[-2%] w-40 h-16 bg-white/60 rounded-full blur-[2px]"></div>
                        <div className="absolute top-[35%] right-[5%] w-32 h-12 bg-white/50 rounded-full blur-[2px]"></div>
                        <div className="absolute top-[60%] left-[10%] w-48 h-16 bg-white/40 rounded-full blur-[2px]"></div>
                    </div>

                    {/* Top Bar */}
                    <header className="w-full max-w-5xl flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <div className="text-center md:text-left">
                            <h1 className="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-700 to-sky-900 tracking-tight drop-shadow-sm">
                                PHONEMIC MASTER
                            </h1>
                            <p className="text-sky-800 text-sm md:text-base tracking-wide mt-1 font-medium">Listen. Speak. Master the Sounds.</p>
                        </div>
                        
                        <div className="flex gap-6 bg-sky-900/50 p-3 rounded-xl border border-sky-800/50 backdrop-blur-sm">
                            <div className="flex flex-col items-center">
                                <span className="text-xs text-sky-400 font-semibold mb-1">XP</span>
                                <span className="font-bold text-lg text-white">{stats.xp}</span>
                            </div>
                            <div className="w-px bg-sky-800"></div>
                            <div className="flex flex-col items-center">
                                <span className="text-xs text-orange-400 font-semibold flex items-center"><Icon name="Flame" size={12} className="mr-1"/> STREAK</span>
                                <span className="font-bold text-lg text-white">{stats.streak}</span>
                            </div>
                            <div className="w-px bg-sky-800"></div>
                            <div className="flex flex-col items-center">
                                <span className="text-xs text-amber-400 font-semibold flex items-center"><Icon name="Award" size={12} className="mr-1"/> MASTERED</span>
                                <span className="font-bold text-lg text-white">{masteredCount}/44</span>
                            </div>
                        </div>
                    </header>

                    {/* Progress Bar (Overall) */}
                    <div className="w-full max-w-5xl mb-8">
                        <div className="h-1.5 w-full bg-sky-950 rounded-full overflow-hidden">
                            <div 
                                className="h-full bg-gradient-to-r from-sky-600 via-sky-400 to-amber-400 transition-all duration-1000"
                                style={{ width: `${(masteredCount / 44) * 100}%` }}
                            ></div>
                        </div>
                    </div>

                    {/* Main Chart Container */}
                    <main className="w-full max-w-5xl bg-sky-950/40 p-4 md:p-8 rounded-3xl border border-sky-800/60 shadow-2xl overflow-hidden relative">
                        
                        {/* Decorative elements */}
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-sky-500 to-transparent opacity-20"></div>
                        
                        <div className="w-full overflow-x-auto chart-scrollbar pb-4">
                            <div className="min-w-[800px] flex flex-col gap-8">
                                
                                {/* VOWELS SECTION */}
                                <div>
                                    <h2 className="text-center text-sky-500 font-bold tracking-widest text-sm mb-4 border-b border-sky-800/50 pb-2">VOWELS</h2>
                                    <div className="flex gap-4">
                                        
                                        {/* MONOPHTHONGS */}
                                        <div className="flex-1 bg-sky-900/20 p-4 rounded-2xl border border-sky-900/50">
                                            <h3 className="text-xs text-sky-400 font-semibold mb-3 text-center opacity-70 tracking-widest">MONOPHTHONGS</h3>
                                            <div className="grid grid-cols-4 gap-2">
                                                {PHONEMES.filter(p => p.cat === 'monophthong').map(p => (
                                                    <PhonemeCard key={p.id} phoneme={p} onSelect={setSelectedPhoneme} progress={progress[p.id]} />
                                                ))}
                                            </div>
                                        </div>

                                        {/* DIPHTHONGS */}
                                        <div className="w-[30%] bg-sky-900/20 p-4 rounded-2xl border border-sky-900/50">
                                            <h3 className="text-xs text-sky-400 font-semibold mb-3 text-center opacity-70 tracking-widest">DIPHTHONGS</h3>
                                            {/* Custom grid to match typical 3-2-3 layout roughly, using flex for simplicity in constraints */}
                                            <div className="grid grid-cols-3 gap-2 h-full content-start">
                                                {PHONEMES.filter(p => p.cat === 'diphthong').map(p => (
                                                    <PhonemeCard key={p.id} phoneme={p} onSelect={setSelectedPhoneme} progress={progress[p.id]} />
                                                ))}
                                            </div>
                                        </div>

                                    </div>
                                </div>

                                {/* CONSONANTS SECTION */}
                                <div className="mt-4">
                                    <h2 className="text-center text-sky-500 font-bold tracking-widest text-sm mb-4 border-b border-sky-800/50 pb-2">CONSONANTS</h2>
                                    <div className="bg-sky-900/20 p-4 rounded-2xl border border-sky-900/50">
                                        <div className="grid grid-cols-8 gap-2">
                                            {PHONEMES.filter(p => p.cat === 'consonant').map(p => (
                                                <PhonemeCard key={p.id} phoneme={p} onSelect={setSelectedPhoneme} progress={progress[p.id]} />
                                            ))}
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </main>

                    {/* Footer Actions (Simulated functionality for UI completeness) */}
                    <div className="flex gap-4 mt-8 flex-wrap justify-center">
                        <button className="px-6 py-3 bg-sky-900/80 hover:bg-sky-800 rounded-xl border border-sky-700 text-sky-200 text-sm font-medium transition-colors shadow-lg flex items-center">
                            <Icon name="RotateCcw" size={16} className="mr-2"/> Practice Weak Sounds
                        </button>
                        <button className="px-6 py-3 bg-gradient-to-r from-sky-600 to-sky-700 hover:from-sky-500 hover:to-sky-600 rounded-xl text-white text-sm font-medium transition-colors shadow-lg shadow-sky-900/50 flex items-center">
                            <Icon name="Play" size={16} className="mr-2"/> Full Pronunciation Test
                        </button>
                    </div>

                    {/* Practice Modal Overlay */}
                    {selectedPhoneme && (
                        <PracticePanel 
                            phoneme={selectedPhoneme} 
                            onClose={() => setSelectedPhoneme(null)} 
                            onResult={handleResult}
                            currentProgress={progress[selectedPhoneme.id]}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
